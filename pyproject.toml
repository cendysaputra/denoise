[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "local-denoise-cli"
version = "0.1.0"
description = "CLI lokal untuk mengurangi noise pada audio dan video"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "imageio-ffmpeg>=0.6.0,<0.7",
]

[project.scripts]
denoise = "denoise_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

